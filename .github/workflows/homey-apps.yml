name: Track new Homey apps

on:
  schedule:
    - cron: '17 3 * * *'   # daily at 03:17 UTC — adjust as you like
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # to commit the updated data/ files back to the repo
  pages: write       # to deploy to GitHub Pages
  id-token: write    # required by the Pages deployment action

concurrency:
  group: "homey-apps-tracker"   # unique to this workflow, so two runs can't race each other
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so a rebase in the commit step below always has a common ancestor to work with

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Snapshot Homey app store and detect new apps
        run: node scripts/snapshot-homey-apps.js

      - name: Post new apps to Homey Community forum (dry run unless POST_TO_FORUM is enabled)
        env:
          POST_TO_FORUM: ${{ vars.POST_TO_FORUM || 'false' }}
          DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
          DISCOURSE_API_USERNAME: ${{ secrets.DISCOURSE_API_USERNAME }}
        run: node scripts/post-new-apps-to-forum.js

      - name: Build static site
        run: node scripts/build-site.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Update Homey app snapshot"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"${{ github.ref_name }}"; then
              echo "Pushed successfully."
              exit 0
            fi

            echo "Push rejected (attempt $attempt) -- fetching and rebasing onto the latest remote state..."
            git fetch origin "${{ github.ref_name }}"
            # -X ours: our freshly-generated snapshot/JSON files always win on conflict --
            # they're fully regenerated each run, not meant to be hand-merged. Genuinely
            # appended log lines from a concurrent run merge in cleanly on their own since
            # they don't overlap with our changes.
            if ! git rebase -X ours "origin/${{ github.ref_name }}"; then
              echo "Rebase failed -- aborting this attempt."
              git rebase --abort
              exit 1
            fi

            sleep $((attempt * 5))
          done

          echo "Failed to push after multiple attempts."
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4